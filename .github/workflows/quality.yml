name: Prototype verification

on:
  push:
    branches:
      - main
      - feat/live-market-intelligence
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # npm install is used until package-lock.json is regenerated in sync with package.json
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build:dev
